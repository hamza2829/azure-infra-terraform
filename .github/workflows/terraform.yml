name: Terraform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Terraform validate
        run: terraform validate -no-color

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.65.0
      - name: Install pinned ruleset
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: TFLint (root and modules)
        run: tflint --recursive --config="$(pwd)/.tflint.hcl"

  checkov:
    name: Checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned Checkov
        run: python -m pip install -r requirements-checks.txt
      - name: Checkov security scan
        run: checkov --directory . --framework terraform github_actions --download-external-modules false --skip-download --compact
        env:
          CKV_ENABLE_REGISTRY_METRICS: "false"
